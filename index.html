<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>ARデブリキャッチ</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;color:#fff;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(ellipse at 50% 120%,#1b3a6b 0%,#0a1328 45%,#03050c 100%);}
  body.cam-on{background:#000}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
  body.cam-on #cam{display:block}
  #gl{position:fixed;inset:0;z-index:1;display:block}
  #hud{position:fixed;left:0;right:0;top:0;z-index:3;display:none;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;pointer-events:none;font-weight:800;font-size:22px;
    text-shadow:0 2px 6px rgba(0,0,0,.7)}
  #hud small{font-size:12px;font-weight:600;opacity:.85;display:block}
  #reticle{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:2;pointer-events:none;display:none;
    border:2px solid rgba(120,220,255,.55);border-radius:50%;box-shadow:0 0 12px rgba(120,220,255,.35)}
  #reticle::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(120,220,255,.8)}
  #mode{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:3;
    font-size:12px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px;pointer-events:none;display:none;white-space:nowrap}
  #arrow{position:fixed;z-index:3;width:0;height:0;pointer-events:none;display:none}
  #arrow::before{content:"";position:absolute;left:-14px;top:-16px;border-left:30px solid #6fe3ff;
    border-top:16px solid transparent;border-bottom:16px solid transparent;filter:drop-shadow(0 0 6px rgba(111,227,255,.8))}
  #flash{position:fixed;inset:0;z-index:4;background:#ff2244;opacity:0;pointer-events:none;transition:opacity .35s}
  .fx{position:fixed;z-index:4;font-weight:900;font-size:24px;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;
    text-shadow:0 2px 6px rgba(0,0,0,.7);animation:up .9s ease-out forwards}
  @keyframes up{to{transform:translate(-50%,-170%);opacity:0}}
  .overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;box-sizing:border-box;background:rgba(3,6,18,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .overlay h1{font-size:32px;margin:0 0 8px}
  .overlay p{margin:6px 0;line-height:1.6;opacity:.92;max-width:340px}
  .rules{margin:14px 0 22px;text-align:left;font-size:15px;line-height:1.9;background:rgba(255,255,255,.07);padding:12px 18px;border-radius:14px}
  button.big{font:inherit;font-size:20px;font-weight:800;color:#04121c;background:#6fe3ff;border:0;border-radius:999px;
    padding:14px 44px;box-shadow:0 6px 0 #2a9ec2;cursor:pointer}
  button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #2a9ec2}
  .note{font-size:12px;opacity:.7;margin-top:16px}
  #score-big{font-size:64px;font-weight:900;margin:4px 0}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div id="hud"><div><small>回収スコア</small><span id="score">0</span></div><div style="text-align:right"><small>TIME</small><span id="time">45</span></div></div>
<div id="reticle"></div>
<div id="arrow"></div>
<div id="mode"></div>
<div id="flash"></div>

<div id="start" class="overlay">
  <h1>🛰 ARデブリキャッチ</h1>
  <p>あなたのまわりを宇宙ゴミ（デブリ）がただよっています。スマホを向けて探し、タップで回収しよう！</p>
  <div class="rules">
    <div>🔩 デブリ（破片・ネジ・パネル）… <b>+10</b></div>
    <div>🚀 使用済みロケット（速い）… <b>+30</b></div>
    <div>🛰 <span style="color:#7dff9b">緑に光る</span>稼働中の衛星 … <b>−20</b> 回収しないで！</div>
  </div>
  <button class="big" id="startBtn">ミッション開始</button>
  <p class="note">カメラと動きセンサーの許可を求められたら「許可」してください。<br>PCではドラッグで見回せます。</p>
</div>

<div id="result" class="overlay" style="display:none">
  <p>ミッション終了！</p>
  <div id="score-big">0</div>
  <p id="detail"></p>
  <p id="best"></p>
  <div style="height:16px"></div>
  <button class="big" id="retryBtn">もう一度</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const GAME_TIME = 45;
  const $ = id => document.getElementById(id);
  const video = $('cam'), canvas = $('gl');

  // ---------- three.js ----------
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
  camera.rotation.order = 'YXZ';
  scene.add(new THREE.HemisphereLight(0xdde8ff, 0x332211, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(3, 4, 2); scene.add(sun);

  // カメラが使えないとき用の宇宙背景（星＋地球）
  const space = new THREE.Group();
  {
    const n = 1500, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const v = new THREE.Vector3().randomDirection ? new THREE.Vector3().randomDirection() :
        new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
      v.multiplyScalar(80); pos.set([v.x, v.y, v.z], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    space.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, sizeAttenuation: true })));
    const earth = new THREE.Mesh(new THREE.SphereGeometry(30, 48, 32),
      new THREE.MeshStandardMaterial({ color: 0x2a6fd6, emissive: 0x0a2350, roughness: 0.8 }));
    earth.position.set(0, -38, -10); space.add(earth);
  }
  scene.add(space);

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  // ---------- 端末の向き → カメラの向き ----------
  let ori = null, usingSensor = false;
  addEventListener('deviceorientation', e => {
    if (e.alpha == null) return;
    ori = e; usingSensor = true;
  });
  const zee = new THREE.Vector3(0, 0, 1), euler = new THREE.Euler(), q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  const rad = THREE.MathUtils.degToRad;
  function screenAngle() { return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
  function applySensor() {
    euler.set(rad(ori.beta), rad(ori.alpha), -rad(ori.gamma), 'YXZ');
    camera.quaternion.setFromEuler(euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -rad(screenAngle())));
  }

  // PC用：ドラッグで見回す
  let yaw = 0, pitch = 0, drag = null;
  canvas.addEventListener('pointerdown', e => {
    if (!playing) return;
    if (usingSensor) { shoot(e.clientX, e.clientY); return; }
    drag = { x: e.clientX, y: e.clientY, moved: 0 };
  });
  addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    yaw += dx * 0.005; pitch = THREE.MathUtils.clamp(pitch + dy * 0.005, -1.3, 1.3);
  });
  addEventListener('pointerup', e => {
    if (drag && drag.moved < 10 && playing) shoot(e.clientX, e.clientY);
    drag = null;
  });

  // ---------- カメラ映像 ----------
  let camStream = null;
  async function startCamera() {
    if (camStream) return true;
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = camStream; await video.play();
      document.body.classList.add('cam-on'); space.visible = false;
      return true;
    } catch (err) { return false; }
  }

  // ---------- 効果音 ----------
  let actx = null;
  function beep(freq, dur, type, to) {
    if (!actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * (to || 0.3), t + dur);
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  }

  // ---------- デブリのモデル ----------
  const metal = c => new THREE.MeshStandardMaterial({ color: c, metalness: 0.35, roughness: 0.45, flatShading: true });
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hitGeo = new THREE.SphereGeometry(1, 12, 8);

  function makeFragment() {            // ぎざぎざの金属片
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 0), metal(0x9aa3ad));
    m.scale.set(1 + Math.random() * .6, 0.5 + Math.random() * .4, 0.8 + Math.random() * .5);
    g.add(m); return { g, size: 0.3, color: 0xb0bac4 };
  }
  function makeBolt() {                // ネジ
    const g = new THREE.Group(), mat = metal(0xc8ccd2);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8), mat);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.07, 6), mat); head.position.y = 0.22;
    g.add(shaft, head); return { g, size: 0.28, color: 0xdde2e8 };
  }
  function makePanel() {               // 断熱材（金色のフィルム）の切れ端
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.02, 0.3),
      new THREE.MeshStandardMaterial({ color: 0xe0a72e, metalness: 0.9, roughness: 0.25, emissive: 0x3a2400 }));
    g.add(m); return { g, size: 0.3, color: 0xffc94d };
  }
  function makeRocket() {              // 使用済みロケット（レア）
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.7, 14),
      new THREE.MeshStandardMaterial({ color: 0xf2f2f2, metalness: 0.3, roughness: 0.5 }));
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.165, 0.165, 0.12, 14),
      new THREE.MeshStandardMaterial({ color: 0xff7a1a, emissive: 0x401800 }));
    band.position.y = 0.12;
    const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.15, 0.16, 12, 1, true), metal(0x555b63));
    nozzle.position.y = -0.43;
    g.add(body, band, nozzle); return { g, size: 0.42, color: 0xff9a3d };
  }
  function makeSatellite() {           // 稼働中の衛星（取ってはダメ）
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28),
      new THREE.MeshStandardMaterial({ color: 0xd9b45a, metalness: 0.8, roughness: 0.3 }));
    const pMat = new THREE.MeshStandardMaterial({ color: 0x1d3f9e, metalness: 0.5, roughness: 0.3, emissive: 0x06123a });
    const pGeo = new THREE.BoxGeometry(0.5, 0.02, 0.22);
    const p1 = new THREE.Mesh(pGeo, pMat); p1.position.x = 0.42;
    const p2 = new THREE.Mesh(pGeo, pMat); p2.position.x = -0.42;
    const dish = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.08, 14, 1, true), metal(0xeeeeee)); dish.position.y = 0.19;
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: 0x7dff9b }));
    lamp.position.set(0, 0, 0.16);
    g.add(body, p1, p2, dish, lamp);
    return { g, size: 0.55, color: 0x7dff9b, lamp };
  }

  const debris = [];
  function camYaw() {
    const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    return Math.atan2(f.x, -f.z);
  }

  function spawn(spread) {
    const r = Math.random();
    const type = r < 0.15 ? 'sat' : r < 0.25 ? 'rocket' : 'junk';
    const made = type === 'sat' ? makeSatellite() : type === 'rocket' ? makeRocket()
      : [makeFragment, makeBolt, makePanel][Math.floor(Math.random() * 3)]();
    const g = made.g;
    const hit = new THREE.Mesh(hitGeo, hitMat); hit.scale.setScalar(made.size); g.add(hit);
    const ang = camYaw() + (Math.random() - 0.5) * spread;
    const dist = 3 + Math.random() * 3;
    g.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    g.scale.setScalar(0.01);
    g.userData = {
      type, color: made.color, lamp: made.lamp, hit,
      ang, dist, y: -0.8 + Math.random() * 1.8,
      w: (Math.random() < .5 ? -1 : 1) * (type === 'rocket' ? 0.35 : 0.06 + Math.random() * 0.1), // 周回の速さ
      vy: (Math.random() - .5) * 0.15,
      spin: new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(type === 'sat' ? 0.4 : 2.5),
      age: 0, life: 11 + Math.random() * 5, caught: 0
    };
    hit.userData.debris = g;
    placeDebris(g);
    scene.add(g); debris.push(g);
  }

  function placeDebris(g) {
    const u = g.userData;
    g.position.set(Math.sin(u.ang) * u.dist, u.y, -Math.cos(u.ang) * u.dist);
  }

  function removeDebris(g) {
    scene.remove(g); debris.splice(debris.indexOf(g), 1);
  }

  // ---------- 回収エフェクト ----------
  const partGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
  const ringGeo = new THREE.TorusGeometry(0.4, 0.025, 8, 40);
  const fxObjs = [];
  function burst(pos, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
      m.position.copy(pos);
      m.userData = { v: new THREE.Vector3((Math.random() - .5), (Math.random() - .5), (Math.random() - .5)).multiplyScalar(speed), life: 0.7, max: 0.7 };
      scene.add(m); fxObjs.push(m);
    }
  }
  function ring(pos, color) {
    const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
    m.position.copy(pos); m.quaternion.copy(camera.quaternion);
    m.userData = { ring: true, life: 0.45, max: 0.45 };
    scene.add(m); fxObjs.push(m);
  }

  function floatText(x, y, text, color) {
    const d = document.createElement('div');
    d.className = 'fx'; d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.color = color;
    document.body.appendChild(d); setTimeout(() => d.remove(), 900);
  }

  // ---------- タップ判定 ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function shoot(x, y) {
    ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(debris.filter(d => !d.userData.caught).map(d => d.userData.hit));
    if (!hits.length) { beep(300, 0.08, 'sine', 0.6); return; }
    const d = hits[0].object.userData.debris, u = d.userData;
    if (u.type === 'sat') {
      score = Math.max(0, score - 20); sats++;
      burst(d.position, 0xff5533, 24, 4); beep(110, 0.45, 'sawtooth');
      floatText(x, y, '−20 衛星を壊した！', '#ff6b6b');
      const f = $('flash'); f.style.transition = 'none'; f.style.opacity = 0.45;
      requestAnimationFrame(() => { f.style.transition = 'opacity .35s'; f.style.opacity = 0; });
      if (navigator.vibrate) navigator.vibrate(200);
      removeDebris(d);
    } else {
      const pts = u.type === 'rocket' ? 30 : 10;
      score += pts; caught++; if (u.type === 'rocket') rockets++;
      u.caught = 0.3;                         // 吸い込まれるように縮んで消える
      ring(d.position, 0x6fe3ff); burst(d.position, u.color, 12, 1.5);
      beep(u.type === 'rocket' ? 500 : 400, 0.18, 'triangle', 3);
      floatText(x, y, `+${pts} 回収！`, u.type === 'rocket' ? '#ffb15c' : '#6fe3ff');
      if (navigator.vibrate) navigator.vibrate(25);
    }
    $('score').textContent = score;
  }

  // ---------- 画面外のデブリを指す矢印 ----------
  const arrow = $('arrow'), tmp = new THREE.Vector3();
  function updateArrow() {
    let best = null, bestAng = Infinity;
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    for (const d of debris) {
      if (d.userData.type === 'sat' || d.userData.caught) continue;
      tmp.copy(d.position).sub(camera.position).normalize();
      const a = fwd.angleTo(tmp);
      if (a < bestAng) { bestAng = a; best = d; }
    }
    if (!best) { arrow.style.display = 'none'; return; }
    const v = best.position.clone().applyMatrix4(camera.matrixWorldInverse);
    const p = best.position.clone().project(camera);
    if (v.z < 0 && Math.abs(p.x) < 0.95 && Math.abs(p.y) < 0.95) { arrow.style.display = 'none'; return; }
    let dx = v.x, dy = -v.y;
    if (Math.hypot(dx, dy) < 1e-3) dy = 1;
    const ang = Math.atan2(dy, dx), c = Math.cos(ang), s = Math.sin(ang);
    const rx = innerWidth / 2 - 36, ry = innerHeight / 2 - 80;
    const t = Math.min(rx / Math.abs(c || 1e-6), ry / Math.abs(s || 1e-6));
    arrow.style.display = 'block';
    arrow.style.left = (innerWidth / 2 + c * t) + 'px';
    arrow.style.top = (innerHeight / 2 + s * t) + 'px';
    arrow.style.transform = `rotate(${ang}rad)`;
  }

  // ---------- ゲーム進行 ----------
  let playing = false, score = 0, caught = 0, rockets = 0, sats = 0, timeLeft = 0, spawnT = 0;

  function startGame() {
    while (debris.length) removeDebris(debris[0]);
    score = caught = rockets = sats = 0; timeLeft = GAME_TIME; spawnT = 0;
    $('score').textContent = 0; $('time').textContent = GAME_TIME;
    $('start').style.display = 'none'; $('result').style.display = 'none';
    $('hud').style.display = 'flex'; $('mode').style.display = 'block'; $('reticle').style.display = 'block';
    playing = true;
    for (let i = 0; i < 3; i++) spawn(0.9);
  }

  function endGame() {
    playing = false; arrow.style.display = 'none';
    $('score-big').textContent = score;
    $('detail').textContent = `回収したデブリ ${caught}個（ロケット ${rockets}） / 衛星にタッチ ${sats}回`;
    let best = 0;
    try { best = +localStorage.getItem('ar-debris-best') || 0; if (score > best) { best = score; localStorage.setItem('ar-debris-best', score); } } catch (e) {}
    $('best').textContent = best ? `ベスト：${best}` : '';
    $('result').style.display = 'flex';
    beep(520, 0.5, 'square', 1);
  }

  $('startBtn').onclick = async () => {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
    }
    $('mode').textContent = '準備中…';
    const camOk = await startCamera();
    startGame();
    setTimeout(() => {
      $('mode').textContent = (camOk ? '📷 カメラON' : '📷 カメラなし') + ' / ' +
        (usingSensor ? '🧭 センサーで見回し' : '🖱 ドラッグで見回し');
    }, 800);
  };
  $('retryBtn').onclick = startGame;

  // ---------- メインループ ----------
  const clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05), now = clock.elapsedTime;

    if (usingSensor && ori) applySensor();
    else camera.rotation.set(pitch, yaw, 0, 'YXZ');
    camera.updateMatrixWorld();
    camera.matrixWorldInverse.copy(camera.matrixWorld).invert();

    if (playing) {
      timeLeft -= dt;
      $('time').textContent = Math.max(0, Math.ceil(timeLeft));
      spawnT -= dt;
      if (spawnT <= 0 && debris.length < 8) { spawn(3.6); spawnT = 0.9; }
      if (timeLeft <= 0) endGame();
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i], u = d.userData;
      u.age += dt;
      if (u.caught) {                            // 回収中：縮みながら消える
        u.caught -= dt;
        d.scale.setScalar(Math.max(0.01, u.caught / 0.3));
        d.rotation.y += dt * 20;
        if (u.caught <= 0) removeDebris(d);
        continue;
      }
      u.ang += u.w * dt; u.y += u.vy * dt;
      placeDebris(d);
      d.rotation.x += u.spin.x * dt; d.rotation.y += u.spin.y * dt; d.rotation.z += u.spin.z * dt;
      // 出現・消滅時にふわっと拡大縮小
      const s = Math.min(1, u.age / 0.4, Math.max(0, (u.life - u.age) / 0.6));
      d.scale.setScalar(Math.max(0.01, s));
      if (u.lamp) u.lamp.visible = Math.sin(now * 6) > -0.3;
      if (u.age >= u.life) removeDebris(d);
    }

    for (let i = fxObjs.length - 1; i >= 0; i--) {
      const p = fxObjs[i], d = p.userData;
      d.life -= dt;
      if (d.ring) p.scale.setScalar(1 + (1 - d.life / d.max) * 1.5);
      else { p.position.addScaledVector(d.v, dt); p.rotation.x += dt * 8; p.rotation.y += dt * 6; }
      p.material.opacity = Math.max(0, d.life / d.max);
      if (d.life <= 0) { scene.remove(p); p.material.dispose(); fxObjs.splice(i, 1); }
    }

    if (playing) updateArrow();
    renderer.render(scene, camera);
  }
  loop();})();
</script>

</html>
